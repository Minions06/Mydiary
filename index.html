<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quellene World</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #0084ff;
      --bg: #f0f2f5;
      --card-bg: #fff;
      --text-main: #1c1e21;
      --text-sub: #65676b;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      overflow-x: hidden;
      margin: 0;
    }
    .header-wrapper { background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    .cover-area {
      max-width: 1100px; margin: 0 auto; height: 380px;
      border-radius: 0 0 15px 15px; overflow: hidden;
      background: linear-gradient(135deg,#e0eafc,#cfdef3); cursor: pointer;
    }
    .cover-area img { width: 100%; height: 100%; object-fit: cover; }
    .profile-container {
      max-width: 1000px; margin: -60px auto 0; display: flex;
      align-items: flex-end; gap: 25px; padding: 0 40px 30px; position: relative;
    }
    #profile-pic {
      width: 170px; height: 170px; border-radius: 50%; border: 6px solid #fff;
      object-fit: cover; box-shadow: 0 10px 25px rgba(0,0,0,.1);
      background: #fff; cursor: pointer; transition: transform .2s; flex-shrink: 0;
    }
    #profile-pic:hover { transform: scale(1.02); }
    .main-content {
      max-width: 1000px; margin: 30px auto; padding: 0 15px;
      display: grid; grid-template-columns: 340px minmax(0,1fr); gap: 25px;
    }
    .glass-card, .post {
      background: var(--card-bg); border-radius: 12px; padding: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,.1); margin-bottom: 20px;
      min-width: 0;
    }
    .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .see-all-link { color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: none; font-size: .9rem; }
    .media-container {
      margin: 15px -20px; background: #000; display: grid; gap: 4px;
      position: relative; overflow: hidden;
    }
    .media-container > img, .media-container .photo-more-overlay > img {
      width: 100%; height: 100%; object-fit: cover; cursor: pointer; min-width: 0; min-height: 0;
    }
    .grid-1 { grid-template-columns: 1fr; max-height: 500px; }
    .grid-1 > img { max-height: 500px; }
    .grid-2 { grid-template-columns: repeat(2,minmax(0,1fr)); height: 300px; }
    .grid-3 { grid-template-columns: repeat(2,minmax(0,1fr)); grid-template-rows: repeat(2,150px); height: 304px; }
    .grid-3 > img:first-child { grid-row: span 2; }
    .grid-more { grid-template-columns: repeat(2,minmax(0,1fr)); grid-template-rows: repeat(2,160px); height: 324px; }
    .photo-more-overlay { position: relative; width: 100%; height: 100%; min-width: 0; min-height: 0; cursor: pointer; }
    .more-count {
      position: absolute; inset: 0; background: rgba(0,0,0,.6); color: #fff;
      font-size: 2rem; font-weight: 700; display: flex; align-items: center;
      justify-content: center; z-index: 5;
    }
    .sidebar-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; border-radius: 8px; overflow: hidden; }
    .sidebar-grid img { width: 100%; height: 100px; object-fit: cover; cursor: pointer; }
    .post-actions { border-top: 1px solid #f0f2f5; padding-top: 8px; display: flex; position: relative; gap: 5px; }
    .act-btn { flex: 1; padding: 10px; border: none; background: none; border-radius: 6px; color: var(--text-sub); font-weight: 600; }
    .act-btn:hover { background: #f2f2f2; }
    .reaction-pop {
      display: none; position: absolute; bottom: calc(100% + 5px); left: 0; background: #fff;
      padding: 8px 15px; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,.15);
      gap: 12px; z-index: 100; border: 1px solid #eee;
    }
    .act-container:hover .reaction-pop, .act-container:focus-within .reaction-pop { display: flex; }
    .emoji { font-size: 24px; cursor: pointer; transition: transform .2s; }
    .emoji:hover { transform: scale(1.3); }
    #gallery-overlay {
      display: none; position: fixed; inset: 0; background: #fff; z-index: 2000;
      overflow-y: auto; padding: 30px 20px;
    }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
    .gallery-grid img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; cursor: pointer; }
    .lightbox {
      display: none; position: fixed; inset: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,.95); z-index: 10000; align-items: center; justify-content: center;
    }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.15);
      color: white; border: none; padding: 12px 18px; font-size: 24px; cursor: pointer;
      border-radius: 50%; z-index: 10001;
    }
    .lb-nav:hover { background: rgba(255,255,255,.3); }
    .lb-prev { left: 20px; } .lb-next { right: 20px; }
    #lb-counter { position: absolute; bottom: 20px; color: white; background: rgba(0,0,0,.6); padding: 5px 15px; border-radius: 20px; font-size: .9rem; }
    .close-lb { position: absolute; top: 15px; right: 20px; background: none; border: none; color: white; font-size: 35px; z-index: 10002; }
    #lock-btn {
      position: fixed; bottom: 25px; right: 25px; width: 58px; height: 58px; border-radius: 50%;
      border: none; background: #fff; box-shadow: 0 10px 20px rgba(0,0,0,.1); cursor: pointer; font-size: 24px; z-index: 1000;
    }
    .post-text { overflow-wrap: anywhere; white-space: normal; }
    .post-text-content { white-space: pre-wrap; overflow-wrap: anywhere; }
    .status-message { overflow-wrap: anywhere; }
    @media (max-width: 850px) {
      .main-content { grid-template-columns: 1fr; gap: 10px; }
      .profile-container { flex-direction: column; align-items: center; text-align: center; padding: 0 20px 25px; gap: 10px; }
      .cover-area { height: 260px; border-radius: 0 0 12px 12px; }
      #profile-pic { width: 145px; height: 145px; }
      .profile-info h1 { font-size: 1.8rem; }
    }
    @media (max-width: 480px) {
      .cover-area { height: 210px; }
      .glass-card, .post { padding: 15px; }
      .media-container { margin-left: -15px; margin-right: -15px; }
      .grid-2 { height: 230px; }
      .grid-3 { grid-template-rows: repeat(2,115px); height: 234px; }
      .grid-more { grid-template-rows: repeat(2,120px); height: 244px; }
      .lb-prev { left: 8px; } .lb-next { right: 8px; }
      .lb-nav { padding: 9px 12px; font-size: 18px; }
      #lock-btn { width: 50px; height: 50px; right: 15px; bottom: 15px; }
    }
  </style>
</head>
<body>
  <div class="header-wrapper">
    <div class="cover-area" onclick="window.zoomImg(document.getElementById('cover-img').src)">
      <img id="cover-img" alt="Cover photo" src="https://placehold.co/1100x380?text=Cover+Photo">
    </div>
    <div class="profile-container">
      <img id="profile-pic" alt="Profile photo" src="https://placehold.co/170?text=Profile" onclick="window.zoomImg(this.src)">
      <div class="profile-info">
        <h1 id="author-name" class="fw-bold">Diary Owner</h1>
        <p id="author-bio">Welcome to my private diary.</p>
      </div>
    </div>
  </div>

  <div class="main-content">
    <aside class="sidebar">
      <div class="glass-card">
        <h5 class="fw-bold mb-3">Intro</h5>
        <div class="mb-2">🏠 Lives in <b id="intro-location">Earth</b></div>
        <div class="mb-2">📍 From <b id="intro-from">Universe</b></div>
        <div class="mb-2">🎂 Birthday <b id="intro-bday">Secret</b></div>
        <div class="mb-2">💖 Status <span id="intro-status">Chillin'</span></div>
      </div>

      <div class="glass-card">
        <div class="card-header-flex">
          <h5 class="fw-bold m-0">Photos</h5>
          <button type="button" class="btn btn-link p-0 see-all-link" onclick="window.openGallery()">See All</button>
        </div>
        <div id="sidebar-photo-grid" class="sidebar-grid"></div>
      </div>

      <div class="glass-card text-center">
        <audio controls loop class="w-100 mb-2" style="height:35px;">
          <source src="./Ako Naman Muna Angela Ken Lyric Video Visualizer.mp3" type="audio/mpeg">
          Your browser does not support audio playback.
        </audio>
        <small class="text-muted fw-bold">Current Mood 🎵</small>
      </div>
    </aside>

    <main class="feed-area">
      <section id="admin-zone" style="display:none;">
        <div class="glass-card" style="border:2px dashed #0084ff;background:#f0f8ff;">
          <h6 class="fw-bold">Update Profile ⚙️</h6>
          <div class="row g-2 mb-3">
            <div class="col-6"><input type="text" id="edit-name" placeholder="Name" class="form-control"></div>
            <div class="col-6"><input type="text" id="edit-location" placeholder="City" class="form-control"></div>
            <div class="col-12"><textarea id="edit-bio" placeholder="Small intro/bio..." class="form-control"></textarea></div>
            <div class="col-4"><input type="text" id="edit-from" placeholder="Hometown" class="form-control"></div>
            <div class="col-4"><input type="text" id="edit-bday" placeholder="Birthday" class="form-control"></div>
            <div class="col-4"><input type="text" id="edit-status" placeholder="Status" class="form-control"></div>
          </div>
          <div class="small fw-bold mb-1">Profile & Cover:</div>
          <input type="file" id="new-pp" accept="image/*" class="form-control mb-2">
          <input type="file" id="new-cover" accept="image/*" class="form-control mb-3">
          <button type="button" class="btn btn-primary w-100 fw-bold" id="save-profile-btn" onclick="window.updateProfile()">Save Changes</button>
          <p id="profile-status" class="small mt-2 mb-0 status-message" role="status"></p>
        </div>

        <div class="glass-card">
          <textarea id="postText" rows="3" placeholder="Ano ang nasa isip mo?" class="form-control border-0 bg-light mb-3"></textarea>
          <input type="file" id="postImage" accept="image/*" multiple class="form-control mb-3">
          <button type="button" class="btn btn-primary w-100 fw-bold" id="uploadBtn">Post Memory</button>
          <p id="u-status" class="small mt-2 text-center status-message" role="status"></p>
        </div>
      </section>
      <div id="feed"></div>
      <p id="feed-status" class="small text-muted text-center" role="status"></p>
    </main>
  </div>

  <div id="gallery-overlay" aria-label="All photos gallery">
    <div style="max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;">
      <h2 class="fw-bold">All Photos</h2>
      <button type="button" class="btn btn-dark rounded-circle" onclick="window.closeGallery()" aria-label="Close gallery">✕</button>
    </div>
    <div id="full-gallery-grid" class="gallery-grid"></div>
  </div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">❮</button>
    <img id="lightbox-img" alt="Expanded photo" style="max-width:90%;max-height:85vh;border-radius:10px;object-fit:contain;">
    <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next photo">❯</button>
    <div id="lb-counter"></div>
    <button type="button" class="close-lb" id="close-lb" aria-label="Close photo viewer">✕</button>
  </div>

  <button type="button" id="lock-btn" onclick="window.askAdmin()" aria-label="Admin login">🔑</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getDatabase, ref, push, onValue, update, remove, runTransaction
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Use your own Firebase project settings here.
    const firebaseConfig = {
      apiKey: "AIzaSyDPhyTW9u9mlECayKF-H6LnbBgUc0UAmzo",
      authDomain: "my-diary-65819.firebaseapp.com",
      databaseURL: "https://my-diary-65819-default-rtdb.firebaseio.com",
      projectId: "my-diary-65819",
      storageBucket: "my-diary-65819.firebasestorage.app"
    };

    // Cloudinary unsigned upload settings. Restrict this preset in your Cloudinary dashboard.
    const CLOUDINARY_CLOUD_NAME = "dhnfxj9qx";
    const CLOUDINARY_UPLOAD_PRESET = "ubjpoppn";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.isAdmin = false;
    let globalImages = [];
    let currentAlbum = [];
    let currentIndex = 0;
    let currentProfile = {};
    let postsListenerStarted = false;
    let allPosts = {};

    const $ = (id) => document.getElementById(id);

    function safeText(value) {
      return String(value ?? "");
    }

    // Build text nodes rather than injecting user-provided text as HTML.
    function addTextWithSeeMore(container, text, limit = 250) {
      container.replaceChildren();
      const fullText = safeText(text);
      const content = document.createElement("span");
      content.className = "post-text-content";

      if (fullText.length <= limit) {
        content.textContent = fullText;
        container.appendChild(content);
        return;
      }

      content.textContent = fullText.slice(0, limit) + "... ";
      const button = document.createElement("button");
      button.type = "button";
      button.className = "btn btn-link p-0 text-decoration-none fw-bold";
      button.style.fontSize = "0.9rem";
      button.textContent = "See more";
      button.addEventListener("click", () => {
        content.textContent = fullText;
        button.remove();
      });
      container.append(content, button);
    }

    function makeElement(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined && text !== null) el.textContent = String(text);
      return el;
    }

    function showStatus(id, message, isError = false) {
      const el = $(id);
      if (!el) return;
      el.textContent = message;
      el.classList.toggle("text-danger", isError);
      el.classList.toggle("text-success", !isError && Boolean(message));
    }

    function updateSlider() {
      const img = $("lightbox-img");
      const counter = $("lb-counter");
      if (!currentAlbum.length) {
        $("lightbox").style.display = "none";
        return;
      }
      currentIndex = (currentIndex + currentAlbum.length) % currentAlbum.length;
      img.src = currentAlbum[currentIndex];
      counter.textContent = `${currentIndex + 1} / ${currentAlbum.length}`;
      $("lb-prev").style.display = currentAlbum.length > 1 ? "block" : "none";
      $("lb-next").style.display = currentAlbum.length > 1 ? "block" : "none";
    }

    window.zoomImg = (src) => {
      if (!src) return;
      currentAlbum = [src];
      currentIndex = 0;
      updateSlider();
      $("lightbox").style.display = "flex";
    };

    window.openSlider = (album, index) => {
      if (!Array.isArray(album) || !album.length) return;
      currentAlbum = album;
      currentIndex = Number(index) || 0;
      updateSlider();
      $("lightbox").style.display = "flex";
    };

    $("lb-prev").addEventListener("click", (event) => {
      event.stopPropagation();
      currentIndex = (currentIndex - 1 + currentAlbum.length) % currentAlbum.length;
      updateSlider();
    });
    $("lb-next").addEventListener("click", (event) => {
      event.stopPropagation();
      currentIndex = (currentIndex + 1) % currentAlbum.length;
      updateSlider();
    });
    $("close-lb").addEventListener("click", () => $("lightbox").style.display = "none");
    $("lightbox").addEventListener("click", (event) => {
      if (event.target === $("lightbox")) $("lightbox").style.display = "none";
    });
    document.addEventListener("keydown", (event) => {
      if ($("lightbox").style.display === "flex") {
        if (event.key === "Escape") $("lightbox").style.display = "none";
        if (event.key === "ArrowLeft" && currentAlbum.length > 1) {
          currentIndex = (currentIndex - 1 + currentAlbum.length) % currentAlbum.length;
          updateSlider();
        }
        if (event.key === "ArrowRight" && currentAlbum.length > 1) {
          currentIndex = (currentIndex + 1) % currentAlbum.length;
          updateSlider();
        }
      }
      if (event.key === "Escape" && $("gallery-overlay").style.display === "block") {
        window.closeGallery();
      }
    });

    window.openGallery = () => {
      $("gallery-overlay").style.display = "block";
      document.body.style.overflow = "hidden";
    };
    window.closeGallery = () => {
      $("gallery-overlay").style.display = "none";
      document.body.style.overflow = "";
    };

    async function uploadToCloudinary(file) {
      if (!file || !file.type.startsWith("image/")) {
        throw new Error("Please select a valid image file.");
      }
      // Limit uploads to 10 MB per image.
      if (file.size > 10 * 1024 * 1024) {
        throw new Error(`${file.name} is larger than 10 MB.`);
      }

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
        { method: "POST", body: formData }
      );
      const result = await response.json().catch(() => ({}));

      if (!response.ok || !result.secure_url) {
        throw new Error(result.error?.message || "Image upload failed. Check your Cloudinary upload preset.");
      }
      return result.secure_url;
    }

    function populateProfileForm(profile) {
      $("edit-name").value = profile.name || "";
      $("edit-location").value = profile.location || "";
      $("edit-bio").value = profile.bio || "";
      $("edit-from").value = profile.from || "";
      $("edit-bday").value = profile.bday || "";
      $("edit-status").value = profile.status || "";
    }

    onValue(ref(db, "profile"), (snapshot) => {
      currentProfile = snapshot.val() || {};
      $("author-name").textContent = currentProfile.name || "Diary Owner";
      $("author-bio").textContent = currentProfile.bio || "Welcome to my private diary.";
      $("profile-pic").src = currentProfile.pic || "https://placehold.co/170?text=Profile";
      $("cover-img").src = currentProfile.cover || "https://placehold.co/1100x380?text=Cover+Photo";
      $("intro-location").textContent = currentProfile.location || "Earth";
      $("intro-from").textContent = currentProfile.from || "Universe";
      $("intro-bday").textContent = currentProfile.bday || "Secret";
      $("intro-status").textContent = currentProfile.status || "Chillin'";
      window.currentPP = currentProfile.pic || "https://placehold.co/170?text=Profile";
      window.currentCP = currentProfile.cover || "https://placehold.co/1100x380?text=Cover+Photo";

      if (window.isAdmin) populateProfileForm(currentProfile);
      renderPosts(allPosts);
    }, (error) => {
      console.error("Profile listener error:", error);
      showStatus("feed-status", "Could not load profile data. Check Firebase rules and connection.", true);
    });

    // NOTE: This password prompt is only a convenience gate, not real security.
    // A client-side password can be read by anyone viewing the source.
    window.askAdmin = () => {
      if (window.isAdmin) {
        window.isAdmin = false;
        $("admin-zone").style.display = "none";
        $("lock-btn").style.display = "block";
        renderPosts(allPosts);
        return;
      }
      const entered = prompt("Admin password:");
      if (entered === null) return;
      if (entered === "qu3113n3") {
        window.isAdmin = true;
        $("admin-zone").style.display = "block";
        $("lock-btn").textContent = "🔒";
        populateProfileForm(currentProfile);
        renderPosts(allPosts);
      } else {
        alert("Incorrect password.");
      }
    };

    window.deletePost = async (postId) => {
      if (!window.isAdmin) {
        alert("Please sign in as admin first.");
        return;
      }
      if (!confirm("Are you sure you want to delete this post?")) return;

      try {
        await remove(ref(db, `posts/${postId}`));
      } catch (error) {
        console.error("Delete post error:", error);
        alert("Failed to delete post. Check your Firebase database rules.");
      }
    };

    window.addReact = async (postId, type) => {
      const allowedTypes = ["like", "love", "haha", "sad"];
      if (!allowedTypes.includes(type)) return;

      try {
        await runTransaction(ref(db, `posts/${postId}/reactions/${type}`), (value) => {
          return (Number(value) || 0) + 1;
        });
      } catch (error) {
        console.error("Reaction error:", error);
        alert("Unable to add reaction. Check your connection.");
      }
    };

    window.addComment = async (postId) => {
      const input = $(`comment-${postId}`);
      const text = input?.value.trim();
      if (!text) return;

      try {
        await push(ref(db, `posts/${postId}/comments`), {
          text,
          date: new Date().toLocaleString()
        });
        input.value = "";
      } catch (error) {
        console.error("Comment error:", error);
        alert("Unable to add comment. Check your connection.");
      }
    };

    function createImage(src, alt, onClick) {
      const img = document.createElement("img");
      img.src = src;
      img.alt = alt || "Diary photo";
      img.loading = "lazy";
      img.addEventListener("click", onClick);
      img.addEventListener("error", () => { img.style.display = "none"; });
      return img;
    }

    function createPost(id, post) {
      const card = makeElement("article", "post");
      const header = makeElement("div", "d-flex justify-content-between align-items-start mb-2");
      const identity = makeElement("div", "d-flex align-items-center");
      const avatar = createImage(window.currentPP, "Profile photo", () => window.zoomImg(window.currentPP));
      Object.assign(avatar.style, {
        width: "40px", height: "40px", borderRadius: "50%", objectFit: "cover",
        marginRight: "10px", flexShrink: "0"
      });
      const identityText = document.createElement("div");
      identityText.append(
        makeElement("div", "fw-bold", $("author-name").textContent),
        makeElement("div", "text-muted small", post.date || "")
      );
      identity.append(avatar, identityText);
      header.appendChild(identity);

      if (window.isAdmin) {
        const deleteBtn = makeElement("button", "btn btn-sm btn-light", "✕");
        deleteBtn.type = "button";
        deleteBtn.setAttribute("aria-label", "Delete post");
        deleteBtn.addEventListener("click", () => window.deletePost(id));
        header.appendChild(deleteBtn);
      }
      card.appendChild(header);

      const postText = makeElement("div", "post-text mb-2");
      addTextWithSeeMore(postText, post.text || "");
      card.appendChild(postText);

      const images = Array.isArray(post.images) ? post.images : [];
      if (images.length) {
        const count = Math.min(images.length, 4);
        const gridClass = images.length === 1 ? "grid-1" : images.length === 2 ? "grid-2" : images.length === 3 ? "grid-3" : "grid-more";
        const media = makeElement("div", `media-container ${gridClass}`);
        const album = images.slice();

        for (let i = 0; i < count; i++) {
          if (images.length >= 4 && i === 3) {
            const wrapper = makeElement("div", "photo-more-overlay");
            wrapper.appendChild(createImage(images[i], "Diary photo", () => window.openSlider(album, i)));
            if (images.length > 4) wrapper.appendChild(makeElement("div", "more-count", `+${images.length - 4}`));
            wrapper.addEventListener("click", (event) => {
              if (event.target.classList.contains("more-count")) window.openSlider(album, i);
            });
            media.appendChild(wrapper);
          } else {
            media.appendChild(createImage(images[i], "Diary photo", () => window.openSlider(album, i)));
          }
        }
        card.appendChild(media);
      }

      const reactions = post.reactions || {};
      const totalReactions = Object.values(reactions).reduce((sum, value) => sum + (Number(value) || 0), 0);
      const comments = post.comments ? Object.values(post.comments) : [];
      const counts = makeElement("div", "d-flex justify-content-between text-muted small py-2 border-bottom");
      counts.append(
        makeElement("span", "", `❤️👍 ${totalReactions} Reactions`),
        makeElement("span", "", `${comments.length} Comments`)
      );
      card.appendChild(counts);

      const actions = makeElement("div", "post-actions");
      const actContainer = makeElement("div", "act-container flex-grow-1 position-relative");
      const pop = makeElement("div", "reaction-pop");
      [["👍","like"],["❤️","love"],["😂","haha"],["😢","sad"]].forEach(([emoji, type]) => {
        const option = makeElement("span", "emoji", emoji);
        option.setAttribute("role", "button");
        option.setAttribute("tabindex", "0");
        option.setAttribute("aria-label", `React ${type}`);
        option.addEventListener("click", () => window.addReact(id, type));
        option.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") window.addReact(id, type);
        });
        pop.appendChild(option);
      });
      const likeBtn = makeElement("button", "act-btn w-100", "Like");
      likeBtn.type = "button";
      likeBtn.addEventListener("click", () => window.addReact(id, "like"));
      actContainer.append(pop, likeBtn);
      const commentBtn = makeElement("button", "act-btn flex-grow-1", "Comment");
      commentBtn.type = "button";
      actions.append(actContainer, commentBtn);
      card.appendChild(actions);

      const commentSection = makeElement("div", "mt-3");
      comments.forEach((comment) => {
        const line = makeElement("div", "mb-1");
        const bubble = makeElement("div", "");
        Object.assign(bubble.style, {
          background: "#f0f2f5", padding: "8px 12px", borderRadius: "15px",
          display: "inline-block", fontSize: ".9rem", overflowWrap: "anywhere"
        });
        const name = makeElement("b", "", "Bisita: ");
        bubble.append(name, document.createTextNode(safeText(comment?.text)));
        line.appendChild(bubble);
        commentSection.appendChild(line);
      });

      const commentInput = document.createElement("input");
      commentInput.type = "text";
      commentInput.id = `comment-${id}`;
      commentInput.placeholder = "Write a comment...";
      commentInput.className = "form-control rounded-pill bg-light border-0 px-3 mt-2";
      commentInput.maxLength = 1000;
      commentInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") window.addComment(id);
      });
      commentBtn.addEventListener("click", () => commentInput.focus());
      commentSection.appendChild(commentInput);
      card.appendChild(commentSection);
      return card;
    }

    function renderPosts(data = {}) {
      const feed = $("feed");
      const sideGrid = $("sidebar-photo-grid");
      const fullGrid = $("full-gallery-grid");
      feed.replaceChildren();
      sideGrid.replaceChildren();
      fullGrid.replaceChildren();
      globalImages = [];

      const entries = Object.entries(data).reverse();
      for (const [id, post] of entries) {
        if (!post || typeof post !== "object") continue;
        feed.appendChild(createPost(id, post));
        const images = Array.isArray(post.images) ? post.images : [];
        images.forEach((url) => {
          if (typeof url === "string" && url) globalImages.push(url);
        });
      }

      globalImages.slice(0, 9).forEach((url, index) => {
        sideGrid.appendChild(createImage(url, `Photo ${index + 1}`, () => window.zoomImg(url)));
      });
      globalImages.forEach((url, index) => {
        fullGrid.appendChild(createImage(url, `Gallery photo ${index + 1}`, () => window.zoomImg(url)));
      });

      if (!entries.length) {
        $("feed-status").textContent = "No memories yet. Sign in as admin to add your first post.";
      } else {
        $("feed-status").textContent = "";
      }
    }

    // One posts listener for the lifetime of the page.
    if (!postsListenerStarted) {
      postsListenerStarted = true;
      onValue(ref(db, "posts"), (snapshot) => {
        allPosts = snapshot.val() || {};
        renderPosts(allPosts);
      }, (error) => {
        console.error("Posts listener error:", error);
        showStatus("feed-status", "Could not load posts. Check your Firebase database rules and internet connection.", true);
      });
    }

    window.updateProfile = async () => {
      if (!window.isAdmin) {
        alert("Please sign in as admin first.");
        return;
      }

      const button = $("save-profile-btn");
      button.disabled = true;
      showStatus("profile-status", "Saving profile...");

      try {
        const pp = $("new-pp").files[0];
        const cp = $("new-cover").files[0];
        const updates = {};

        // Empty fields retain their existing values; use a non-empty value to change a field.
        const fields = {
          name: "edit-name",
          location: "edit-location",
          bio: "edit-bio",
          from: "edit-from",
          bday: "edit-bday",
          status: "edit-status"
        };
        for (const [key, inputId] of Object.entries(fields)) {
          const value = $(inputId).value.trim();
          if (value !== "") updates[key] = value;
        }

        if (pp) updates.pic = await uploadToCloudinary(pp);
        if (cp) updates.cover = await uploadToCloudinary(cp);

        if (!Object.keys(updates).length) {
          showStatus("profile-status", "No changes to save.");
          return;
        }

        await update(ref(db, "profile"), updates);
        $("new-pp").value = "";
        $("new-cover").value = "";
        showStatus("profile-status", "Profile saved successfully!");
      } catch (error) {
        console.error("Profile update error:", error);
        showStatus("profile-status", error.message || "Failed to save profile.", true);
      } finally {
        button.disabled = false;
      }
    };

    $("uploadBtn").addEventListener("click", async () => {
      if (!window.isAdmin) {
        alert("Please sign in as admin first.");
        return;
      }

      const button = $("uploadBtn");
      const text = $("postText").value.trim();
      const files = Array.from($("postImage").files || []);

      if (!text && files.length === 0) {
        showStatus("u-status", "Please write a memory or select at least one photo.", true);
        return;
      }
      if (files.length > 10) {
        showStatus("u-status", "You can upload up to 10 images per post.", true);
        return;
      }

      button.disabled = true;
      showStatus("u-status", "Posting memory...");
      try {
        const urls = [];
        for (let i = 0; i < files.length; i++) {
          showStatus("u-status", `Uploading image ${i + 1} of ${files.length}...`);
          urls.push(await uploadToCloudinary(files[i]));
        }

        await push(ref(db, "posts"), {
          text,
          images: urls,
          date: new Date().toLocaleString()
        });

        $("postText").value = "";
        $("postImage").value = "";
        showStatus("u-status", "Memory posted successfully!");
      } catch (error) {
        console.error("Post upload error:", error);
        showStatus("u-status", error.message || "Failed to post memory.", true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
